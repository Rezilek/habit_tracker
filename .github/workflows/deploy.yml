name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, homework35.2 ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: habit_test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage flake8
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --statistics
    
    - name: Run tests with coverage
      env:
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        DEBUG: 'False'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'
        POSTGRES_DB: habit_test_db
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        CELERY_BROKER_URL: redis://localhost:6379/0
        CELERY_RESULT_BACKEND: redis://localhost:6379/0
        CSRF_TRUSTED_ORIGINS: 'http://localhost,http://127.0.0.1,http://158.160.86.6'
      run: |
        python manage.py migrate
        coverage run manage.py test
        coverage report
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: .coverage
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/homework35.2' || github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "/var/www/habit_tracker"
        strip_components: 0
        overwrite: true
    
    - name: Setup environment and deploy
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /var/www/habit_tracker
          
          # Создаем виртуальное окружение если его нет
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          
          # Активируем виртуальное окружение и устанавливаем зависимости
          source venv/bin/activate
          pip install -r requirements.txt
          pip install gunicorn psycopg2-binary redis
          
          # Создаем .env файл
          echo "SECRET_KEY='${{ secrets.SECRET_KEY }}'" > .env
          echo "DEBUG='False'" >> .env
          echo "ALLOWED_HOSTS='${{ secrets.SERVER_HOST }}'" >> .env
          echo "POSTGRES_DB='${{ secrets.DB_NAME }}'" >> .env
          echo "POSTGRES_USER='${{ secrets.DB_USER }}'" >> .env
          echo "POSTGRES_PASSWORD='${{ secrets.DB_PASSWORD }}'" >> .env
          echo "DB_HOST='localhost'" >> .env
          echo "DB_PORT='5432'" >> .env
          echo "REDIS_URL='redis://localhost:6379/0'" >> .env
          echo "CELERY_BROKER_URL='redis://localhost:6379/0'" >> .env
          echo "CELERY_RESULT_BACKEND='redis://localhost:6379/0'" >> .env
          echo "CORS_ALLOWED_ORIGINS='http://${{ secrets.SERVER_HOST }}'" >> .env
          
          # Применяем миграции
          python manage.py migrate
          
          # Собираем статику
          python manage.py collectstatic --noinput
          
          # Перезапускаем Gunicorn
          sudo systemctl restart gunicorn
          
          # Перезапускаем Celery
          sudo systemctl restart celery
          sudo systemctl restart celery-beat
          
          # Перезапускаем Nginx
          sudo systemctl reload nginx